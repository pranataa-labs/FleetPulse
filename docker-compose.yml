version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetpulse-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "FleetPulse"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      LOG_CHANNEL: "daily"
      LOG_DAILY_DAYS: 14
      ADMIN_PREFIX: "fleetpulse-ops-mgmt"
      DB_CONNECTION: "sqlite"
      BROADCAST_CONNECTION: "reverb"
      REVERB_APP_ID: "849770"
      REVERB_APP_KEY: "qd4vy0399kdjzcecok6u"
      REVERB_APP_SECRET: "bawsd73zxdpj3cfhmueu"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: "http"
    volumes:
      - fleetpulse-storage:/var/www/storage

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetpulse-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - fleetpulse-storage:/var/www/storage

volumes:
  fleetpulse-storage:
